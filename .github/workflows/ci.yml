name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pi itself requires Node >= 22.19, so older runtimes are not testable
        # targets for an extension that runs inside it.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: End-to-end through the real pi CLI
        run: npm run e2e
      # Coverage runs the same suite, so do it once instead of in its own job.
      - name: Coverage thresholds
        if: matrix.node == 22
        run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run
      - name: Verify the packed extension installs cleanly
        shell: bash
        run: |
          mkdir -p .package-smoke
          npm pack --pack-destination .package-smoke
          npm install --ignore-scripts --omit=peer --prefix .package-smoke/install .package-smoke/*.tgz
          test -d .package-smoke/install/node_modules/@nguyenquangthai/pi-ask
